name: worldmonitor

x-log-policy: &log-policy
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-common-service: &common-service
  restart: unless-stopped
  logging: *log-policy
  networks:
    - worldmonitor-internal

services:
  worldmonitor:
    <<: *common-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "${WM_NODE_IMAGE:-node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43}"
    image: "worldmonitor/app:${WM_IMAGE_TAG:-local}"
    ports:
      - "127.0.0.1:${WM_LOCAL_HEALTH_PORT:-18100}:8080"
    environment:
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN is required}"
      WM_SESSION_SECRET: "${WM_SESSION_SECRET:?WM_SESSION_SECRET is required}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: docker
      LOCAL_API_CLOUD_FALLBACK: "false"
      WM_TRUSTED_PROXY_CIDRS: "172.31.28.0/24"
      WS_RELAY_URL: http://ais-relay:3004
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET is required}"
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      TRAVELPAYOUTS_API_TOKEN: "${TRAVELPAYOUTS_API_TOKEN:-}"
      OPENAQ_API_KEY: "${OPENAQ_API_KEY:-}"
      WAQI_API_KEY: "${WAQI_API_KEY:-}"
    depends_on:
      redis-rest:
        condition: service_healthy
      ais-relay:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2.0

  ais-relay:
    <<: *common-service
    build:
      context: ../..
      dockerfile: Dockerfile.relay
      args:
        NODE_IMAGE: "${WM_NODE_IMAGE:-node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43}"
    image: "worldmonitor/ais-relay:${WM_IMAGE_TAG:-local}"
    environment:
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET is required}"
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN is required}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      UCDP_ACCESS_TOKEN: "${UCDP_ACCESS_TOKEN:-}"
      MARKET_YAHOO_REFRESH_INTERVAL_MS: "${MARKET_YAHOO_REFRESH_INTERVAL_MS:-900000}"
      PORT: "3004"
    depends_on:
      redis-rest:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0

  redis:
    <<: *common-service
    image: "${WM_REDIS_IMAGE:-redis:7-alpine}"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - worldmonitor-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    mem_limit: 512m
    cpus: 0.75

  redis-rest:
    <<: *common-service
    build:
      context: ../../docker
      dockerfile: Dockerfile.redis-rest
      args:
        NODE_IMAGE: "${WM_NODE_IMAGE:-node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43}"
    image: "worldmonitor/redis-rest:${WM_IMAGE_TAG:-local}"
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN is required}"
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
      SRH_MAX_BODY_BYTES: "16777216"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: Bearer $$SRH_TOKEN\" http://127.0.0.1/ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    cpus: 0.75

  seeders:
    <<: *common-service
    user: "${WM_RUNTIME_UID:-1000}:${WM_RUNTIME_GID:-1000}"
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile.seeders
      args:
        NODE_IMAGE: "${WM_NODE_IMAGE:-node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43}"
    image: "worldmonitor/seeders:${WM_IMAGE_TAG:-local}"
    environment:
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN is required}"
      REDIS_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN is required}"
      SEED_INTERVAL_SECONDS: "${SEED_INTERVAL_SECONDS:-1800}"
      INITIAL_SEED_DELAY_SECONDS: "${INITIAL_SEED_DELAY_SECONDS:-20}"
      SEED_TIMEOUT: "${SEED_TIMEOUT:-1800}"
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
      UCDP_ACCESS_TOKEN: "${UCDP_ACCESS_TOKEN:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      TRAVELPAYOUTS_API_TOKEN: "${TRAVELPAYOUTS_API_TOKEN:-}"
      OPENAQ_API_KEY: "${OPENAQ_API_KEY:-}"
      WAQI_API_KEY: "${WAQI_API_KEY:-}"
    volumes:
      - ./runtime:/runtime
    depends_on:
      redis-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 1536m
    cpus: 2.0

  auth-proxy:
    <<: *common-service
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile.auth-proxy
      args:
        NODE_IMAGE: "${WM_NODE_IMAGE:-node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43}"
    image: "worldmonitor/auth-proxy:${WM_IMAGE_TAG:-local}"
    environment:
      WM_AUTH_COOKIE_SECRET: "${WM_AUTH_COOKIE_SECRET:?WM_AUTH_COOKIE_SECRET is required}"
    volumes:
      - type: bind
        source: "${WM_AUTH_FILE:-./shared/auth/worldmonitor.htpasswd}"
        target: /run/secrets/worldmonitor_htpasswd
        read_only: true
    depends_on:
      worldmonitor:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  quick-tunnel:
    <<: *common-service
    user: "${WM_RUNTIME_UID:-1000}:${WM_RUNTIME_GID:-1000}"
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile.quick-tunnel
      args:
        TUNNEL_BASE_IMAGE: "${WM_TUNNEL_BASE_IMAGE:-alpine:3.22}"
        CLOUDFLARED_VERSION: "${CLOUDFLARED_VERSION:-2026.8.2}"
        CLOUDFLARED_AMD64_SHA256: "${CLOUDFLARED_AMD64_SHA256:-fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2}"
    image: "worldmonitor/quick-tunnel:${WM_IMAGE_TAG:-local}"
    environment:
      WM_TUNNEL_ORIGIN: http://auth-proxy:8080
    volumes:
      - ./runtime:/runtime
    depends_on:
      auth-proxy:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

networks:
  worldmonitor-internal:
    name: worldmonitor-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.28.0/24

volumes:
  worldmonitor-redis-data:
    name: worldmonitor-redis-data
