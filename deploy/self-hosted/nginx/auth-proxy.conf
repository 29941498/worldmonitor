worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map_hash_bucket_size 128;

  log_format safe '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout safe;

  client_body_temp_path /var/lib/nginx/tmp/client_body;
  proxy_temp_path /var/lib/nginx/tmp/proxy;
  client_max_body_size 16m;
  sendfile on;
  keepalive_timeout 65;

  # Cloudflare overwrites this header with the visitor-facing protocol before
  # forwarding the request to the tunnel origin. Keep plaintext visitors away
  # from the Basic Auth challenge so credentials are never submitted over HTTP.
  map $http_x_forwarded_proto $wm_redirect_https {
    default 0;
    http 1;
  }

  # A browser may satisfy the initial Basic Auth challenge while its service
  # worker performs later same-origin fetches without replaying Authorization.
  # Exchange the successful challenge for a Secure, HttpOnly session cookie so
  # those requests remain protected instead of failing with a misleading 401.
  map $cookie_wm_gateway $wm_auth_cookie_valid {
    default 0;
    "__WM_AUTH_COOKIE_SECRET__" 1;
  }

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      access_log off;
      auth_basic off;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location = /_wm_cookie_auth {
      internal;
      if ($wm_auth_cookie_valid = 1) {
        return 204;
      }
      return 401;
    }

    location / {
      if ($wm_redirect_https) {
        return 308 https://$host$request_uri;
      }

      satisfy any;
      auth_request /_wm_cookie_auth;
      auth_basic "World Monitor";
      auth_basic_user_file /run/secrets/worldmonitor_htpasswd;

      proxy_pass http://worldmonitor:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_buffering off;

      # Deliberately omit `always`: Nginx must never issue a valid gateway
      # cookie on a 401 response. With no Max-Age this expires with the browser
      # session; Basic Auth can establish a new one on the next visit.
      add_header Set-Cookie "wm_gateway=__WM_AUTH_COOKIE_SECRET__; Path=/; Secure; HttpOnly; SameSite=Strict";
      add_header Cache-Control "private" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
  }
}
