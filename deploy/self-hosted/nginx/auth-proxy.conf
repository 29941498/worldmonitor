worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format safe '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout safe;

  client_body_temp_path /var/lib/nginx/tmp/client_body;
  proxy_temp_path /var/lib/nginx/tmp/proxy;
  client_max_body_size 16m;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      access_log off;
      auth_basic off;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location / {
      auth_basic "World Monitor";
      auth_basic_user_file /run/secrets/worldmonitor_htpasswd;

      proxy_pass http://worldmonitor:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_buffering off;

      add_header Cache-Control "private" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
  }
}
