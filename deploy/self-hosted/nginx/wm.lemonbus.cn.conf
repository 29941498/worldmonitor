map $http_upgrade $wm_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream worldmonitor_authenticated_gateway {
    server 192.168.10.30:18101 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name wm.lemonbus.cn;

    return 301 https://wm.lemonbus.cn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wm.lemonbus.cn;

    ssl_certificate /data/cert/wm/wm.lemonbus.cn.pem;
    ssl_certificate_key /data/cert/wm/wm.lemonbus.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WM_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://worldmonitor_authenticated_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wm_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
